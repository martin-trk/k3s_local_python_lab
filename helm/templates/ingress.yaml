apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ .Release.Name }}-{{ .Values.name }}-ingress

spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:  
          - path: /
            pathType: Prefix
            
            backend:
              service:
                name: {{ .Release.Name }}-{{ .Values.name }}-service
                port:
                  number: {{ .Values.service.port }}