stages:
  - build
  - pre-terraform
  - deploy_plan
  - deploy_apply
  - post-deployment-test
  - destroy_plan
  - destroy_apply

variables:
  LOCAL_DOCKER_REGISTRY: "registry:5000"
  MYAPP_IMAGE: "myapp"
  MYAPP_IMAGE_TAG: "v0.1.0-ci"
  MYAPP_FULL_PATH: "$LOCAL_DOCKER_REGISTRY/$MYAPP_IMAGE:$MYAPP_IMAGE_TAG"
  TF_ROOT: "${CI_PROJECT_DIR}/terraform"
  TF_PLAN_FILE: "assessment-plan-${CI_PIPELINE_ID}.tfplan"
  LOCAL_RUN: "false"

.env_rules: &env_rules
  - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main"'
    variables:
      TF_VARS_FILE: "tfvars/prod_terraform.tfvars"
  - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
    variables:
      TF_VARS_FILE: "tfvars/preprod_terraform.tfvars"
  - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^feat\/.*/'
    variables:
      TF_VARS_FILE: "tfvars/dev_terraform.tfvars"
  - if: '$CI_COMMIT_BRANCH'
    when: never

.env_rules_destroy: &env_rules_destroy
  - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main"'
    variables:
      TF_VARS_FILE: "tfvars/prod_terraform.tfvars"
  - if: '$CI_COMMIT_BRANCH =~ /^release\/.*/'
    variables:
      TF_VARS_FILE: "tfvars/preprod_terraform.tfvars"
  - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH =~ /^feat\/.*/'
    variables:
      TF_VARS_FILE: "tfvars/dev_terraform.tfvars"
  - if: '$CI_COMMIT_BRANCH'
    when: never

# Created for local test due to the failure of gitlab-ci-local
# Ready to copy and paste commands to set the variables which would been set by the pipeline on variables block above.
# This enables to run all the jobs manually
variable-set-job-for-local-test:
  stage: pre-terraform
  image: docker:cli
  script:
    - |
        export LOCAL_DOCKER_REGISTRY="registry:5000"
        echo $LOCAL_DOCKER_REGISTRY
        export MYAPP_IMAGE=myapp
        echo $MYAPP_IMAGE
        export MYAPP_IMAGE_TAG="v0.1.0-ci"
        echo $MYAPP_IMAGE_TAG
        export MYAPP_FULL_PATH=$LOCAL_DOCKER_REGISTRY/$MYAPP_IMAGE:$MYAPP_IMAGE_TAG
        echo $MYAPP_FULL_PATH
        export CI_PROJECT_DIR=$(pwd)
        echo $CI_PROJECT_DIR
        export TF_ROOT=${CI_PROJECT_DIR}/terraform
        echo $TF_ROOT
        export CI_PIPELINE_ID=12345679
        echo $CI_PIPELINE_ID
        export TF_PLAN_FILE=assessment-plan-${CI_PIPELINE_ID}.tfplan
        echo $TF_PLAN_FILE
        export TF_VARS_FILE=tfvars/prod_terraform.tfvars
        echo $TF_VARS_FILE
  rules:
    - if: '$LOCAL_RUN == "true"'

docker-build-and-push:
  image: docker:cli
  services:
    - name: docker:dind
      command:
        - --insecure-registry=registry:5000
  variables:
    DOCKER_TLS_CERTDIR: ""
  stage: build
  script:
    - docker build --tag ${MYAPP_FULL_PATH} ./app
    - docker push ${MYAPP_FULL_PATH}

# Ideally it would be placed into a template file, or in the beginning of the CI file, placed here to prevent missing of these scripts running in local
.terraform_setup: &terraform_setup
  image: hashicorp/terraform:latest
  cache:
    key: terraform
    paths:
      - ${TF_ROOT}/.terraform
      - ${TF_ROOT}/.terraform.lock.hcl
  before_script:
    - cd ${TF_ROOT}
    - terraform init
    - terraform validate

terraform_plan:
  <<: *terraform_setup
  stage: deploy_plan
  needs:
    - docker-build-and-push
  rules: *env_rules
  script:
    - terraform plan -var-file=${TF_VARS_FILE} -out=${TF_PLAN_FILE}
  artifacts:
    paths:
      - ${TF_ROOT}/${TF_PLAN_FILE}
      - ${TF_ROOT}/.terraform.lock.hcl
    expire_in: 1 day

terraform_apply:
  <<: *terraform_setup
  stage: deploy_apply
  needs:
    - terraform_plan
  rules: *env_rules
  script:
    - terraform apply -input=false ${TF_PLAN_FILE}
  artifacts:
    paths:
      - ${TF_ROOT}/terraform.tfstate
      - ${TF_ROOT}/terraform.tfstate.backup
    expire_in: 30 days

deployment_post_test:
  stage: post-deployment-test
  needs:
    - terraform_apply
  rules: *env_rules
  script:
    - cd ${CI_PROJECT_DIR}
    - ./app/test_requests.sh

terraform_destroy_plan:
  <<: *terraform_setup
  needs:
    - job: terraform_apply
      optional: true
  stage: destroy_plan
  when: manual
  rules: *env_rules_destroy
  script:
    - terraform plan -destroy -var-file=${TF_VARS_FILE} -out=assessment-destroy-plan-${CI_PIPELINE_ID}.tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/assessment-destroy-plan-${CI_PIPELINE_ID}.tfplan
    expire_in: 1 day

terraform_destroy_apply:
  <<: *terraform_setup
  stage: destroy_apply
  when: manual
  needs:
    - terraform_destroy_plan
  rules: *env_rules_destroy
  script:
    - terraform apply -input=false assessment-destroy-plan-${CI_PIPELINE_ID}.tfplan
  artifacts:
    paths:
      - ${TF_ROOT}/terraform.tfstate
      - ${TF_ROOT}/terraform.tfstate.backup
    expire_in: 30 days